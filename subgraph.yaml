specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: enjoy-pump-fun-database-bsc-test
    network: chapel
    source:
      address: "0xe141cC402d13BE43085DCC30b7Ef88Bf890Bdd27"
      abi: enjoy-pump-fun-database-bsc-test
      startBlock: 55084670
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Bonded
        - NewTokenCreated
        - OwnerSet
        - Holder
        - BondingCurve
        - BondingCurveTrade
      abis:
        - name: enjoy-pump-fun-database-bsc-test
          file: ./abis/enjoy-pump-fun-database-bsc-test.json
        - name: bonding_curve
          file: ./abis/bonding-curve.json
      eventHandlers:
        - event: Bonded(address)
          handler: handleBonded
        - event: NewTokenCreated(indexed address,address,address,uint256,bytes)
          handler: handleNewTokenCreated
        - event: OwnerSet(indexed address,indexed address)
          handler: handleOwnerSet
      file: ./src/enjoy-pump-fun-database-bsc-test.ts
templates:
  - name: bonding_curve
    kind: ethereum/contract
    network: chapel
    source:
      abi: bonding_curve
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - BondingCurve
        - BondingCurveTrade
        - Holder
        - BondingCurveHourBucket
      abis:
        - name: bonding_curve
          file: ./abis/bonding-curve.json
      eventHandlers:
        - event: Buy(indexed address,uint256,uint256)
          handler: handleBuy
        - event: Sell(indexed address,uint256,uint256)
          handler: handleSell
      file: ./src/bonding-curve.ts
